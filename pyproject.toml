[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mepseg"
version = "0.1.0"
description = "Segmentazione di nuvole di punti per impianti MEP (scan-to-BIM): pipeline ibrida geometria + deep learning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mepseg contributors" }]
keywords = ["point-cloud", "MEP", "scan-to-bim", "segmentation", "BIM", "lidar"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "open3d>=0.17",
    "laspy[lazrs]>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
e57 = ["pye57>=0.4"]
dl = ["torch>=2.0"]
gui = ["fastapi>=0.100", "uvicorn>=0.23", "matplotlib>=3.7"]
tutto = ["pye57>=0.4", "torch>=2.0", "fastapi>=0.100", "uvicorn>=0.23", "matplotlib>=3.7"]

[project.scripts]
mepseg = "mepseg.cli:principale"
mepseg-gui = "mepseg.gui.server:principale"

[project.urls]
Repository = "https://github.com/guglielmobaccheschi/mepseg"

[tool.setuptools]
packages = ["mepseg", "mepseg.dl", "mepseg.gui"]

[tool.setuptools.package-data]
"mepseg.gui" = ["static/*"]
